<div class="list-page">
    <h2>Cities</h2>
    <div class="toolbar">
        <a class="primary" (click)="add()">+ Add City</a>
        <input type="search" placeholder="Search city or country…" [value]="search()"
            (input)="onSearch($any($event.target).value)" />
        <div class="spacer"></div>
        <select (change)="onPageSizeChange($any($event.target).value)">
            <option [selected]="pageSize() === 10">10</option>
            <option [selected]="pageSize() === 20">20</option>
            <option [selected]="pageSize() === 50">50</option>
        </select>
        <span>per page</span>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Country</th><th>Actions</th></tr></thead>
        <tbody>
            @for (c of cities(); track c.city_id) {
            <tr>
                <td>{{ c.city_id }}</td>
                <td>{{ c.name }}</td>
                <td>{{ c.country_name }}</td>
                <td class="actions">
                    <button class="primary" (click)="edit(c.city_id)">Edit</button>
                    <button class="danger" (click)="delete(c.city_id)">Delete</button>
                </td>
            </tr>
            } @empty {
            <tr><td colspan="4">No cities match.</td></tr>
            }
        </tbody>
    </table>
    <div class="pagination">
        <button [disabled]="page() <= 1" (click)="goToPage(page() - 1)">‹ Prev</button>
        @for (p of pages(); track p) {
        <button [class.active]="p === page()" (click)="goToPage(p)">{{ p }}</button>
        }
        <button [disabled]="page() >= totalPages()" (click)="goToPage(page() + 1)">Next ›</button>
        <span class="info">{{ total() }} cities · page {{ page() }} of {{ totalPages() }}</span>
    </div>
    <div class="loading" [class.hidden]="!loading()">Loading…</div>
</div>
