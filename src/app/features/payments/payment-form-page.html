<div class="form-page">
    <h2>{{ mode() === 'edit' ? 'Edit payment' : 'Record payment' }}</h2>

    @if (mode() === 'edit' && loadError(); as err) {
    <div class="error">{{ err }}</div>
    }

    <div class="field">
        <label>Customer *</label>
        <select [value]="customerId()" (change)="onCustomerChange($any($event.target).value)">
            <option [value]="null" disabled>Select customer…</option>
            @for (c of customers(); track c.customer_id) {
            <option [value]="c.customer_id">{{ c.first_name }} {{ c.last_name }}</option>
            }
        </select>
        @if (customerError()) { <span class="field-error">Customer is required.</span> }
    </div>

    <div class="field">
        <label>Staff (optional)</label>
        <select [value]="staffId()" (change)="staffId.set($any($event.target).value)">
            <option value="">— None —</option>
            @for (s of staffs(); track s.staff_id) {
            <option [value]="s.staff_id">{{ s.first_name }} {{ s.last_name }}</option>
            }
        </select>
    </div>

    <div class="field">
        <label>Rental (optional)</label>
        <select [value]="rentalId()" (change)="rentalId.set($any($event.target).value)">
            <option value="">— None —</option>
            @for (r of rentals(); track r.rental_id) {
            <option [value]="r.rental_id">#{{ r.rental_id }} · {{ r.title }} ({{ r.customer_name }})</option>
            }
        </select>
    </div>

    <div class="field">
        <label>Amount *</label>
        <input type="number" step="0.01" min="0" [value]="amount()" (input)="amount.set($any($event.target).value)" />
        @if (amountError()) { <span class="field-error">Amount must be a positive number.</span> }
    </div>

    <div class="field">
        <label>Payment date *</label>
        <input type="date" [value]="paymentDate()" (input)="paymentDate.set($any($event.target).value)" />
        @if (dateError()) { <span class="field-error">Payment date is required.</span> }
    </div>

    <div class="form-actions">
        <button (click)="cancel()">Cancel</button>
        <button class="primary" [disabled]="!formValid() || saving()" (click)="submit()">
            {{ mode() === 'edit' ? 'Save changes' : 'Record payment' }}
        </button>
    </div>
</div>
