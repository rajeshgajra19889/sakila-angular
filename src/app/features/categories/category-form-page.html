<div class="form-page">
    <h2>{{ mode() === 'edit' ? 'Edit category' : 'New category' }}</h2>
    @if (loadError(); as err) { <div class="error">{{ err }}</div> }
    <div class="field">
        <label>Name *</label>
        <input [value]="name()" (input)="name.set($any($event.target).value)" />
        @if (nameError()) { <span class="field-error">Name is required.</span> }
    </div>
    <div class="form-actions">
        <button (click)="cancel()">Cancel</button>
        <button class="primary" [disabled]="!formValid() || saving()" (click)="submit()">
            {{ mode() === 'edit' ? 'Save changes' : 'Create category' }}
        </button>
    </div>
</div>
