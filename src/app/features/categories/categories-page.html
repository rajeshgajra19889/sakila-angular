<div class="list-page">
    <h2>Categories</h2>
    <div class="toolbar">
        <a class="primary" (click)="add()">+ Add Category</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Actions</th></tr></thead>
        <tbody>
            @for (c of categories(); track c.category_id) {
            <tr>
                <td>{{ c.category_id }}</td>
                <td>{{ c.name }}</td>
                <td class="actions">
                    <button class="primary" (click)="edit(c.category_id)">Edit</button>
                    <button class="danger" (click)="delete(c.category_id)">Delete</button>
                </td>
            </tr>
            } @empty {
            <tr><td colspan="3">No categories.</td></tr>
            }
        </tbody>
    </table>
    <div class="loading" [class.hidden]="!loading()">Loading…</div>
</div>
